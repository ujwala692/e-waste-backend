spring.application.name=recircle
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recircle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
app.admin.email=${ADMIN_EMAIL:admin@recircle.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
